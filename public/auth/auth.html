<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة تسجيل الدخول | مستشفى بني مزار التخصصي</title>
  <link rel="stylesheet" href="../style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-body">

  <div class="auth-container">
    <div class="auth-header">
      <span class="auth-logo" onclick="location.href='../index.html'">🏥</span>
      <h2>مستشفى بني مزار التخصصي</h2>
      <p class="text-muted">الرجاء تسجيل الدخول للوصول إلى لوحة التحكم الخاصة بك</p>
    </div>

    <div class="auth-card">
      <div class="auth-tabs">
        <button id="tabLogin" class="tab-btn active" onclick="switchTab('login')">تسجيل الدخول</button>
        <button id="tabRegister" class="tab-btn" onclick="switchTab('register')">فتح حساب مريض جديد</button>
      </div>

      <!-- نموذج تسجيل الدخول -->
      <form id="loginForm" onsubmit="handleAuthLogin(event)">
        <div class="form-group">
          <label>رقم الهاتف المسجل:</label>
          <input type="tel" id="loginPhone" placeholder="01xxxxxxxxx" required>
        </div>
        <div class="form-group">
          <label>كلمة المرور:</label>
          <input type="password" id="loginPass" placeholder="******" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-2">تسجيل الدخول للنظام</button>

        <div class="quick-demo-section mt-3">
          <p class="demo-title">⚡ تسجيل سريع بضغطة زر لجميع الحسابات:</p>
          <div class="demo-grid">
            <button type="button" class="btn-chip" onclick="quickFill('01018622861','Amr307&&')">
              🦴 د. عمرو عثمان (عظام)
            </button>
            <button type="button" class="btn-chip" onclick="quickFill('01012006904','Malak136&&')">
              👶 د. ملك محسن (أطفال)
            </button>
            <button type="button" class="btn-chip" onclick="quickFill('01107677972','Malak136@@')">
              🩺 د. ملك صلاح (باطنة)
            </button>
            <button type="button" class="btn-chip" onclick="quickFill('01065432198','KarimRad2026!')">
              🩻 د. كريم الشريف (أشعة)
            </button>
            <button type="button" class="btn-chip" onclick="quickFill('01143219876','NourhanLab2026#')">
              🧪 د. نورهان البدري (معمل)
            </button>
            <button type="button" class="btn-chip" onclick="quickFill('01287654321','GamalPharma2026$')">
              💊 د. مصطفى الجمال (صيدلية)
            </button>
            <button type="button" class="btn-chip" onclick="quickFill('01033221100','Emergency2026#')">
              🚨 د. حازم القاضي (طوارئ 24/7)
            </button>
            <button type="button" class="btn-chip" onclick="quickFill('01025841963','BaniMazarAdmin2026#')">
              👑 د. عبد الرحمن (مدير المستشفى)
            </button>
            <button type="button" class="btn-chip chip-patient" onclick="quickFill('01009694831','Ahmed123456#')">
              👤 أحمد محمود عثمان (مريض O-)
            </button>
          </div>
        </div>
      </form>

      <!-- نموذج إنشاء حساب مريض -->
      <form id="registerForm" class="hidden" onsubmit="handleAuthRegister(event)">
        <div class="form-group">
          <label>الاسم بالكامل (ثلاثي):</label>
          <input type="text" id="regName" placeholder="مثال: أحمد محمود عثمان" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>رقم الهاتف:</label>
            <input type="tel" id="regPhone" placeholder="01xxxxxxxxx" required>
          </div>
          <div class="form-group">
            <label>كلمة المرور:</label>
            <input type="password" id="regPass" placeholder="كلمة مرور قوية" required>
          </div>
        </div>
        <div class="form-row-3">
          <div class="form-group">
            <label>فصيلة الدم:</label>
            <select id="regBloodType">
              <option value="O-">O- (نادر ومعطي عام)</option>
              <option value="O+">O+</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
            </select>
          </div>
          <div class="form-group">
            <label>النوع:</label>
            <select id="regGender">
              <option value="MALE">ذكر</option>
              <option value="FEMALE">أنثى</option>
            </select>
          </div>
          <div class="form-group">
            <label>الوزن (كجم):</label>
            <input type="number" id="regWeight" value="75">
          </div>
        </div>
        <button type="submit" class="btn btn-success w-100 mt-2">إنشاء الملف الطبي والدخول فوراً</button>
      </form>
    </div>
  </div>

  <script type="module" src="auth.js"></script>
</body>
</html>
